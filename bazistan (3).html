<style>
:root{--bg:#070a1a;--card:#101532;--card2:#171d45;--tx:#eaf0ff;--mut:#8f9bc7;--c1:#35d0ff;--c2:#9b5cff;--c3:#1de9c6;--r:18px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}

*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,#2a1a6b55,transparent),radial-gradient(900px 500px at 0% 10%,#0a4d7a44,transparent),var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh}

.gc .b{padding:12px}.gc small{color:var(--mut);display:block;margin:4px 0 10px}

.row.me{outline:2px solid var(--c1)}

.r1{box-shadow:0 0 20px #ffd24a55}.av{font-size:28px}

.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}

.bar{height:10px;background:var(--card2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c3))}
.auth{max-width:400px;margin:8vh auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--card2);padding:12px;border-radius:12px;text-align:center}.stat b{display:block;font-size:20px;color:var(--c1)}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:12px}
.modal .box{width:min(560px,100%);max-height:90vh;overflow:auto}
#pad{height:200px;border-radius:16px;background:var(--card2);display:grid;place-items:center;font-size:22px;user-select:none;cursor:pointer;margin:12px 0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:fit-content;background:var(--c2);padding:10px 18px;border-radius:12px;z-index:30;animation:in .3s}

@media(max-width:640px){.modal{padding:0}.modal .box{border-radius:0;min-height:100dvh;width:100%!important}.gf{height:calc(100dvh - 110px)!important}.hero h1{font-size:23px}.nav{gap:4px}.tab{padding:6px 8px;font-size:13px}.logo{font-size:18px}}@media(min-width:641px){.gf{height:min(78vh,860px)!important}}
</style>

;width:70px;display:inline-block;vertical-align:middle}.bar i{display:block;height:100%;background:var(--ac)}\n.sw{display:inline-block;width:30px;height:30px;border-radius:50%;margin:4px;border:2px solid #fff8;cursor:pointer;font-size:12px;line-height:30px}\nh2{margin:4px 0 8px}small{opacity:.8}label{display:block;margin:10px 0;text-align:right}input[type=range]{width:100%}\n#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px);box-sizing:border-box}\n#top{display:flex;justify-content:space-between;gap:6px;padding-top:8px}\n.st{background:var(--bg);border-radius:12px;padding:5px 10px;font-weight:700;font-size:15px;min-width:58px;text-align:center}.st small{display:block;font-size:10px}\n#pb{height:6px;background:#ffffff30;margin-top:8px;border-radius:4px;overflow:hidden}#pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#35e0ff,#ffb84d)}\n.tb{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);pointer-events:auto;width:74px;height:74px;border-radius:50%;border:2px solid #35e0ff;background:var(--bg);color:#fff;font:700 13px Vazirmatn,Tahoma,sans-serif}\n#pz{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);left:10px;pointer-events:auto;width:40px;height:40px;border-radius:12px;border:0;background:var(--bg);color:#fff;font-size:18px}\n.nt .tb{display:none}.tb{opacity:.92;-webkit-tap-highlight-color:transparent;box-shadow:0 0 14px #35e0ff88}#fr{box-shadow:0 0 18px #f338}#jy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border:2px solid #fff6;border-radius:50%;pointer-events:none}#jy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#35e0ffaa}\n#fl{position:fixed;inset:0;background:radial-gradient(transparent 40%,#f33);opacity:0;pointer-events:none}\n#msg{position:fixed;top:30%;width:100%;text-align:center;font-size:34px;font-weight:800;text-shadow:0 2px 12px #000;pointer-events:none}\n\u003c/style }

/* ============ Views ============ */
function card(g,i){const best=S&&S.best[g.id];return`<div class="gc" style="animation-delay:${i*40}ms"><div class="img" style="background:linear-gradient(135deg,hsl(${(i*53)%360} 70% 30%),hsl(${(i*53+60)%360} 70% 18%))">${g.emoji}</div><div class="b"><b>${esc(g.name)}</b> <span class="pill" style="font-size:11px">${g.cat}</span><small>${esc(g.desc)}${best?`<br>رکورد شما: ${fa(best)}`:""}</small><div style="display:flex;gap:6px"><button class="btn" data-play="${g.id}" ${g.status!=="ready"?'style="opacity:.5"':""}>${g.status==="ready"?"شروع بازی":"به‌زودی"}</button><button class="btn ghost" data-fav="${g.id}">${S.fav.includes(g.id)?"❤️":"🤍"}</button></div></div></div>`}
function gamesList(list){return list.length?`<div class="grid">${list.map(card).join("")}</div>`:'<div class="box">بازی‌ای پیدا نشد.</div>'}
function boardHtml(n){const r=ranking();return r.slice(0,n).map((p,i)=>`<div class="row r${i+1} ${S&&p.id===S.uid?"me":""}"><div class="rk">${fa(i+1)}</div><span class="av">${p.av}</span><b style="flex:1">${esc(p.name)}</b><span>${fa(p.score)} ⭐</span></div>`).join("")}
function render(){
 if(cleanup){cleanup();cleanup=null}
 if(!S)return authView();daily();
 const L=lvl(S.xp),pct=Math.min(100,(S.xp-lvlStart(L))/(lvlStart(L+1)-lvlStart(L))*100),rank=ranking().findIndex(p=>p.id===S.uid)+1;
 let main="";
 const filtered=GAMES.filter(g=>(cat==="همه"||g.cat===cat)&&g.name.includes(q));
 const catBar=`<div class="tabs">${CATS.map(c=>`<button class="tab ${c===cat?"on":""}" data-cat="${c}">${c}</button>`).join("")}</div>`;
 if(view==="home")main=`<div class="hero"><div class="orb"></div><h1>سلام ${esc(S.name)} ${S.av}</h1><p>بازی کن، امتیاز بگیر و در جدول جهانی بالا برو!</p><button class="btn" data-go="games" style="background:#fff;color:#4a1fa8">مشاهده بازی‌ها</button></div>
 <div class="stats"><div class="stat"><b>${fa(S.score)}</b>امتیاز</div><div class="stat"><b>${fa(L)}</b>سطح</div><div class="stat"><b>${rank?fa(rank):"-"}</b>رتبه جهانی</div></div>
 <h2>🔥 بازی‌های محبوب و جدید</h2>${gamesList(GAMES.filter(g=>g.status==="ready").concat(GAMES.filter(g=>g.status!=="ready").slice(0,3)))}
 <div class="grid" style="margin-top:6px"><div><h2>🏅 جدول برتر</h2><div class="box">${boardHtml(5)}</div></div><div><h2>🎯 مأموریت‌های روزانه</h2><div class="box">${missionsHtml()}</div></div></div>`;
 if(view==="games")main=`<h2>بازی‌ها</h2><input id="srch" placeholder="🔍 جست‌وجوی بازی" value="${esc(q)}">${catBar}<div style="height:12px"></div>${gamesList(filtered)}`;
 if(view==="board")main=`<h2>🌍 جدول رتبه‌بندی جهانی (۱۰۰ نفر برتر)</h2><div class="box">${boardHtml(100)}</div><p style="color:var(--mut);margin-top:8px;font-size:13px">${dbp?"زنده و آنلاین":"حالت آزمایشی: برای جدول آنلاین، صفحه باید با حساب کاربری باز شود"} · بازیکنان نمونه با اطلاعات آزمایشی نمایش داده می‌شوند.</p>`;
 if(view==="upload")main=uploadHtml();
 if(view==="profile")main=`<div class="box"><div style="display:flex;gap:14px;align-items:center"><span style="font-size:60px">${S.av}</span><div><h2 style="margin:0">${esc(S.name)}</h2><span class="pill">سطح ${fa(L)}</span></div></div><div class="bar" style="margin:12px 0"><i style="width:${pct}%"></i></div>
 <div class="stats"><div class="stat"><b>${fa(S.score)}</b>مجموع امتیاز</div><div class="stat"><b>${fa(S.games)}</b>تعداد بازی</div><div class="stat"><b>${rank?fa(rank):"-"}</b>رتبه جهانی</div><div class="stat"><b>${fa(S.xp)}</b>XP</div></div></div>
 <h2>رکوردهای شخصی</h2><div class="box">${Object.keys(S.best).length?Object.entries(S.best).map(([id,v])=>`<div class="row">${(GAMES.find(g=>g.id===id)||{}).emoji||"🎮"} <b style="flex:1">${esc((GAMES.find(g=>g.id===id)||{name:id}).name)}</b>${fa(v)}</div>`).join(""):"هنوز رکوردی ثبت نشده."}</div>
 <h2>❤️ بازی‌های موردعلاقه</h2>${gamesList(GAMES.filter(g=>S.fav.includes(g.id)))}
 <h2>🏆 دستاوردها</h2><div class="grid">${ACH.map(a=>`<div class="box" style="opacity:${S.ach.includes(a.id)?1:.4}"><div style="font-size:30px">${a.i}</div><b>${a.t}</b><br><small style="color:var(--mut)">${a.d}</small></div>`).join("")}</div>
 <h2>⚙️ تنظیمات</h2><div class="box"><button class="btn ghost" id="snd">${SET.sound?"🔊 صدا روشن":"🔇 صدا خاموش"}</button> <button class="btn ghost" id="thm">${SET.theme==="dark"?"🌙 حالت تاریک":"☀️ حالت روشن"}</button> <button class="btn ghost" id="out">خروج از حساب</button></div>`;
 document.getElementById("app").innerHTML=`<header><div class="wrap nav"><div class="logo">بازیستان</div>${[["home","خانه"],["games","بازی‌ها"],["board","رتبه‌بندی"],["upload","بارگذاری"],["profile","پروفایل"]].map(t=>`<button class="tab ${view===t[0]?"on":""}" data-go="${t[0]}">${t[1]}</button>`).join("")}<span class="pill">⭐ ${fa(S.score)}</span></div></header><div class="wrap">${main}</div>`;
 bind();
}
function uploadHtml(){const cu=store.get("bz_custom")||[];return`<h2>📤 بارگذاری بازی</h2><div class="box"><p style="color:var(--mut);font-size:14px">یک فایل HTML تک‌فایلی انتخاب کنید (حداکثر ۳ مگابایت). بازی داخل محیط ایزوله اجرا می‌شود. برای ثبت امتیاز، در کد بازی <code dir="ltr">parent.postMessage({bz:"finish",score:123},"*")</code> را صدا بزنید (یا <code dir="ltr">{bz:"add",delta:10}</code> برای افزودن تدریجی). بازی‌هایی که امتیاز نفرستند هم اجرا می‌شوند.</p><input type="file" id="uf" accept=".html,.htm,text/html"><input id="un2" maxlength="40" placeholder="نام بازی"><select id="uc">${CATS.slice(1).map(c=>`<option>${c}</option>`).join("")}</select><input id="ue" maxlength="2" placeholder="ایموجی (مثلاً 🎲)"><input id="ud" maxlength="120" placeholder="توضیح کوتاه"><select id="ur"><option value="">بازی جدید</option>${GAMES.filter(g=>g.status==="ready"&&g.html).map(g=>`<option value="${g.id}">نسخه جدید برای: ${esc(g.name)}</option>`).join("")}</select><input id="uv" type="number" min="1" value="1" placeholder="شماره نسخه"><button class="btn" id="ub" style="width:100%">بارگذاری و افزودن به سایت</button></div><h2>بازی‌های بارگذاری‌شده</h2><div class="box">${cu.length?cu.map(g=>`<div class="row">${g.emoji} <b style="flex:1">${esc(g.name)} <small style="color:var(--mut)">نسخه ${fa(g.version)}</small></b><button class="btn ghost" data-del="${g.id}">حذف</button></div>`).join(""):"هنوز بازی‌ای بارگذاری نشده."}</div>`}
function missionsHtml(){const d=daily();return MISSIONS.map(m=>{const v=Math.min(m.goal,d[m.key]);return`<div style="margin-bottom:10px">${m.t} ${d.done.includes(m.id)?"✅":""}<div class="bar"><i style="width:${v/m.goal*100}%"></i></div><small style="color:var(--mut)">${fa(v)} / ${fa(m.goal)} · پاداش ${fa(m.xp)} XP</small></div>`}).join("")}
function bind(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{view=b.dataset.go;render()});
 document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;render()});
 document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{const i=S.fav.indexOf(b.dataset.fav);i<0?S.fav.push(b.dataset.fav):S.fav.splice(i,1);save();render()});
 document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>play(b.dataset.play));
 const s=document.getElementById("srch");if(s)s.oninput=()=>{q=s.value;const p=s.selectionStart;render();const n=document.getElementById("srch");n.focus();n.setSelectionRange(p,p)};
 const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
 on("ub",doUpload);
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;store.set("bz_custom",(store.get("bz_custom")||[]).filter(g=>g.id!==id));const i=GAMES.findIndex(g=>g.id===id);if(i>=0)GAMES.splice(i,1);const d=BDEF.find(x=>x.id===id);if(d)registerGame(d);render()});
 on("snd",()=>{SET.sound=!SET.sound;store.set("bz_set",SET);render()});
 on("thm",()=>{SET.theme=SET.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=SET.theme;store.set("bz_set",SET);render()});
 on("out",()=>{S=null;store.set("bz_user",null);step=1;render()});
}

/* ============ Play + rewards ============ */
function finish(g,score){
 const d=daily();S.score+=score;S.xp+=score+10;S.games++;d.games++;d.score+=score;S.best[g.id]=Math.max(S.best[g.id]||0,score);
 MISSIONS.forEach(m=>{if(!d.done.includes(m.id)&&d[m.key]>=m.goal){d.done.push(m.id);S.xp+=m.xp;toast("مأموریت کامل شد! +"+m.xp+" XP")}});
 ACH.forEach(a=>{if(!S.ach.includes(a.id)&&a.ok(S)){S.ach.push(a.id);toast("🏆 دستاورد: "+a.t)}});
 save();const e=document.getElementById("sc");if(e)e.textContent="امتیاز کل: "+fa(S.score)+" · رکورد: "+fa(S.best[g.id]);
}
function doUpload(){
 const f=document.getElementById("uf").files[0],name=document.getElementById("un2").value.trim();
 if(!f)return toast("فایل بازی را انتخاب کنید");if(f.size>3e6)return toast("حجم فایل بیشتر از ۳ مگابایت است");if(name.length<2)return toast("نام بازی را وارد کنید");
 const rep=document.getElementById("ur").value,ver=Math.max(1,parseInt(document.getElementById("uv").value)||1);
 const old=rep&&GAMES.find(g=>g.id===rep);if(old&&ver<(old.version||0))return toast("شماره نسخه باید برابر یا بیشتر از نسخه فعلی ("+old.version+") باشد");
 const r=new FileReader();r.onload=()=>{const html=String(r.result);if(!/<\w+/.test(html))return toast("فایل HTML معتبر نیست");
  const g={id:rep||"u-"+Date.now().toString(36),name,cat:document.getElementById("uc").value,emoji:document.getElementById("ue").value||"🎮",desc:document.getElementById("ud").value||"بازی بارگذاری‌شده",version:ver,html};
  const list=(store.get("bz_custom")||[]).filter(x=>x.id!==g.id);list.push(g);
  if(!store.set("bz_custom",list))return toast("حافظه مرورگر پر است؛ یک بازی قدیمی را حذف کنید");
  const i=GAMES.findIndex(x=>x.id===g.id);if(i>=0)GAMES.splice(i,1);registerGame({...g,status:"ready"});toast("بازی اضافه شد ✅");view="games";render()};
 r.readAsText(f)}
const SHIM='<script>try{localStorage.getItem("x")}catch(e){var _m={};Object.defineProperty(window,"localStorage",{value:{getItem:function(k){return k in _m?_m[k]:null},setItem:function(k,v){_m[k]=String(v)},removeItem:function(k){delete _m[k]},clear:function(){_m={}}}})}window.Bazistan={finish:function(s){parent.postMessage({bz:"finish",score:s},"*")},add:function(d){parent.postMessage({bz:"add",delta:d},"*")}};<\/script>';
function buildDoc(g){let h=g.html;const m=h.match(/<head[^>]*>/i);h=m?h.replace(m[0],m[0]+SHIM):SHIM+h;return h+(g.hook?"<script>"+g.hook+"<\/script>":"")}
function play(id){
 const g=GAMES.find(x=>x.id===id);if(!g||g.status!=="ready")return toast("این بازی به‌زودی اضافه می‌شود");
 const m=document.createElement("div");m.className="modal";const big=!!g.html;
 m.innerHTML=`<div class="box" style="${big?"width:min(1100px,100%)":""}"><div style="display:flex;gap:6px"><h2 style="margin:0;flex:1">${g.emoji} ${esc(g.name)}</h2>${big?'<button class="btn ghost" id="fs">⛶</button>':""}<button class="btn ghost" id="x">✕</button></div><p id="sc" style="color:var(--mut)">رکورد: ${fa(S.best[g.id]||0)}</p><div id="gm"></div></div>`;
 document.body.append(m);
 const api={finish:s=>finish(g,s),sound};let off=null,fr=null,earned=0,ml=null;
 if(big){fr=document.createElement("iframe");fr.className="gf";fr.style.cssText="width:100%;height:72vh;border:0;border-radius:12px;background:#000";fr.setAttribute("sandbox","allow-scripts allow-pointer-lock allow-modals");fr.setAttribute("allow","fullscreen;autoplay;accelerometer;gyroscope");fr.setAttribute("allowfullscreen","");fr.srcdoc=buildDoc(g);document.getElementById("gm").append(fr);
  ml=e=>{if(!fr||e.source!==fr.contentWindow||!e.data||!e.data.bz)return;const d=e.data;
   if(d.bz==="finish"){const s=Math.max(0,Math.min(1e6,Math.floor(+d.score)||0));finish(g,s);earned=-1}
   else if(d.bz==="add"){const n=Math.max(0,Math.min(1e5,Math.floor(+d.delta)||0));if(n){addScore(g,n);earned+=n}}};
  window.addEventListener("message",ml);
  document.getElementById("fs").onclick=()=>{try{fr.requestFullscreen()}catch(e){}}}
 else off=g.mount(document.getElementById("gm"),api);
 document.getElementById("x").onclick=()=>{if(off)off();if(ml)window.removeEventListener("message",ml);if(earned>0){S.games++;daily().games++;save()}m.remove();render()};
}
function addScore(g,n){const d=daily();S.score+=n;S.xp+=n;d.score+=n;S.best[g.id]=Math.max(S.best[g.id]||0,(S.best[g.id]||0));g._run=(g._run||0)+n;S.best[g.id]=Math.max(S.best[g.id]||0,g._run);ACH.forEach(a=>{if(!S.ach.includes(a.id)&&a.ok(S)){S.ach.push(a.id);toast("🏆 دستاورد: "+a.t)}});MISSIONS.forEach(m=>{if(!d.done.includes(m.id)&&d[m.key]>=m.goal){d.done.push(m.id);S.xp+=m.xp;toast("مأموریت کامل شد! +"+m.xp+" XP")}});clearTimeout(addScore.t);addScore.t=setTimeout(save,1500);const e=document.getElementById("sc");if(e)e.textContent="امتیاز کل: "+fa(S.score)}
render();initDb();
</script>
</body>
</html>
